title: "[Auth] "
labels: ["area:auth", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the [Integration Guide](https://developer.elonky.com/en/documentation/) first.

        **Never post client IDs, client secrets or access tokens.** Replace them with `<redacted>`.
  - type: dropdown
    id: topic
    attributes:
      label: What do you need help with?
      options:
        - Creating integration credentials
        - Choosing scopes
        - Requesting an access token
        - Using the Bearer token in requests
        - Rotating, disabling or deleting an integration
        - Token expiry
        - Other
    validations:
      required: true
  - type: dropdown
    id: error
    attributes:
      label: Error you are seeing
      options:
        - No error, I have a how-to question
        - 400 Bad Request
        - 401 Unauthorized
        - 502 Bad Gateway
        - 504 Gateway Timeout
        - Other
    validations:
      required: true
  - type: input
    id: timestamp
    attributes:
      label: Timestamp of the request
      description: Include the time zone, preferably UTC.
      placeholder: "e.g. 2026-10-07 14:32 UTC"
  - type: input
    id: correlation-id
    attributes:
      label: Trace or correlation ID
      description: If one was returned in the response.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to achieve?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What did you try and what happened?
      description: Include a sanitized request and response. Remove credentials and tokens first.
      render: shell
    validations:
      required: true
