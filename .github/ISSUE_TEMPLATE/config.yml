blank_issues_enabled: false
contact_links:
  - name: Ask a question or get integration help
    url: https://github.com/Elonky/developers/discussions/new/choose
    about: For "how do I...?" questions and integration help, please use Discussions instead of Issues.
  - name: Read the documentation
    url: https://developer.elonky.com/en/documentation/
